name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Pipeline data dapat direproduksi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Jalankan pipeline
        working-directory: analysis
        run: |
          uv sync --frozen
          uv run python 01_build_panel.py
          uv run python 02_analysis.py
          uv run python 03_export_web.py
      - name: JSON hasil harus sama dengan yang di-commit
        run: git diff --exit-code -- web/public/data data/processed

  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
